document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

· Georgia Tech<span style=\"letter-spacing: 1.8px;\">&nbsp;| BCI · NeuroAI<\u002Fspan><\u002Fdiv>\n        <h1 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:54px;line-height:1.05;margin:18px 0 22px;letter-spacing:-0.02em\">Aligning brains and transformers <span style=\"color:var(--accent)\">— to interpret AI and decode the mind.<\u002Fspan><\u002Fh1>\n        \n        <p style=\"margin: 0 0 22px; max-width: 560px; font-size: 16.5px; line-height: 1.7; color: #aeb9d0; font-weight: 400; position: relative\">I am a fourth-year Ph.D. student at <span style=\"color: rgb(219, 227, 242);\">Georgia Tech ECE<\u002Fspan>, advised by <a href=\"https://siva.ece.gatech.edu/\" target=\"_blank\" rel=\"noopener\" class=\"scp5\" style=\"color: rgb(219, 227, 242); text-decoration: none; border-bottom: 1px solid rgba(91, 155, 255, 0.4); transition: color 0.18s, border-color 0.18s;\">Prof. Raghupathy Sivakumar<\u002Fa> in the <a href=\"https://gnan.ece.gatech.edu/index.html\" target=\"_blank\" rel=\"noopener\" class=\"scp5\" style=\"color: rgb(219, 227, 242); text-decoration: none; border-bottom: 1px solid rgba(91, 155, 255, 0.4); transition: color 0.18s, border-color 0.18s;\">GNAN Lab<\u002Fa>. <br>I study how brains and AI models experience the world in surprisingly similar ways — and how each can unlock new capabilities in the other.<\u002Fp>\n        <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace\">\n          <a href=\"#research\" style=\"background:var(--accent);color:#06122b;font-weight:600;font-size:13.5px;padding:13px 22px;border-radius:9px\">explore_research →<\u002Fa>\n          <a href=\"assets/Cheng-Yeh-Chen-CV.pdf\" target=\"_blank\" style=\"border:1px solid rgba(255,255,255,0.18);color:#dbe3f2;font-size:13.5px;padding:13px 22px;border-radius:9px\">download_cv.pdf<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- id card -->\n      <div style=\"justify-self:end;border:1px solid rgba(255,255,255,0.1);border-radius:16px;overflow:hidden;background:#0e1832;width:300px;animation:cycFadeIn 1.1s ease both;box-shadow:0 24px 60px rgba(0,0,0,0.35)\">\n        \n        <img src=\"37af4ea5-8fb3-4ee1-89d1-037f0e5133ef\" alt=\"Cheng-Yeh Chen\" style=\"width:100%;height:auto;display:block\">\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- research -->\n    <section id=\"research\" style=\"padding:4px 0 60px\" data-rev=\"\">\n      <div style=\"display:grid;grid-template-columns:1fr 56%;gap:34px;align-items:center;margin:8px 0 26px\">\n        <div>\n          <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:34px;margin:0 0 10px;letter-spacing:-0.01em\">My Research Focus<\u002Fh2>\n          <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#aeb9d0;max-width:580px\">Convergence between biological and artificial representations is now measurable, and increasingly reproducible. I quantify that <b data-cx=\"1\" style=\"color: rgb(232, 237, 247); transition: opacity 0.22s;\">alignment<\u002Fb>, then run it both ways — <b data-cx=\"2\" style=\"color: rgb(232, 237, 247); transition: opacity 0.22s;\">encoding<\u002Fb> brain activity from model features, <b data-cx=\"3\" style=\"color: rgb(232, 237, 247); transition: opacity 0.22s;\">decoding<\u002Fb> perception from brain signals — and use the brain's hierarchy as a reference to <b data-cx=\"4\" style=\"color: rgb(232, 237, 247); transition: opacity 0.22s;\">interpret<\u002Fb> what AI models have learned.<\u002Fp>\n          <p style=\"margin:0;font-size:13px;letter-spacing:0.08em;font-family:'IBM Plex Mono',monospace;display:flex;gap:7px;flex-wrap:wrap\"><span data-cx=\"1\" style=\"color:#5b9bff;transition:opacity .22s ease\">align<\u002Fspan><span style=\"color:#5f6b83\">▸<\u002Fspan><span data-cx=\"2\" style=\"color:#7d8dff;transition:opacity .22s ease\">encode<\u002Fspan><span style=\"color:#5f6b83\">▸<\u002Fspan><span data-cx=\"3\" style=\"color:#9a7dfa;tr guage, vision, and speech models. A faithful encoder is a working model of perception itself.<\u002Fp>\n          <div style=\"margin-top: 16px; font-family: 'IBM Plex Mono',monospace; font-size: 11px; letter-spacing: 0.12em; color: #7d8dff\">Brain-Score (Vision) #6<span style=\"letter-spacing: 1.32px;\">&nbsp;·&nbsp;<br><\u002Fspan>Algonauts 2025 (Post-Challenge)<span style=\"letter-spacing: 1.32px;\">🥇<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-cx=\"3\" style=\"transition:opacity .22s ease;border:1px solid rgba(154,125,250,0.26);border-radius:16px;padding:24px 22px;background:linear-gradient(140deg,rgba(154,125,250,0.075),rgba(255,255,255,0.012))\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"font-size:26px\">🧠 ➡️ 🤖<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;color:#9a7dfa;font-weight:600\">03<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:19px;margin:14px 0 8px;font-weight:500\">Neural decoding<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#aeb9d0\">Run the alignment in reverse — reconstructing the seen image, heard speech, or read text directly from fMRI / MEG / EEG / iEEG, past state of the art.<\u002Fp>\n          <div style=\"margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#9a7dfa\">Brain-to-Text'24 🥇 · <br>EEG-to-text/image SOTA<span style=\"letter-spacing: 1.32px;\">&nbsp;·&nbsp;<br>MEG-to-speech<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-cx=\"4\" style=\"transition:opacity .22s ease;border:1px solid rgba(179,112,238,0.26);border-radius:16px;padding:24px 22px;background:linear-gradient(140deg,rgba(179,112,238,0.075),rgba(255,255,255,0.012))\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"font-size:26px\">🧠 🔬 🤖<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;color:#b370ee;font-weight:600\">04<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:19px;margin:14px 0 8px;font-weight:500\">Interpretability<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#aeb9d0\">Turn the brain's hierarchy into <i>ground truth for interpreting AI<\u002Fi> — tracing ViT circuits through cortex and mapping where, anatomically, ViT computation lives inside each transformer block.<\u002Fp>\n          <div style=\"margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#b370ee\">ViT-via-cortex<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- signature: interactive NeuroAI roadmap -->\n    <section style=\"padding:0 0 66px\" data-rev=\"\">\n      <div id=\"cyc-roadmap-panel\" style=\"border:1px solid rgba(255,255,255,0.09);border-radius:16px;background:linear-gradient(180deg,#0c1426,#090f1e);padding:22px 26px 20px;overflow:hidden\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px\">\n          <div>\n            <div style=\"font-family: 'Space Grotesk',sans-serif; font-weight: 600; font-size: 25px; color: #eaf0fb; letter-spacing: -0.01em\">My BCI and NeuroAI Research Roadmap<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8a97ad;margin-top:2px\">Deciphering the whisper of the brain across stimuli and&nbsp;modalities<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.05em;color:var(--accent)\">hover a node to trace its pathway ✦<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"cyc-roadmap-root\" sc-camel-on-mouse-over=\"{{ onFigOver }}\" sc-camel-on-mouse-leave=\"{{ onFigLeave }}\" style=\"position:relative;width:100%;height:640px;margin-top:8px\">\n          <canvas id=\"cyc-roadmap\" style=\"position:absolu tle=\"2. sunsean — 72.191\" style=\"position:absolute;top:7px;left:1.3%;width:2.5px;height:22px;background:#cfd6e4\"><\u002Fdiv>\n              <div title=\"1. cchen847 (Ours) — 72.643\" style=\"position:absolute;top:4px;left:0.6%;width:3px;height:28px;background:#f4c04a;box-shadow:0 0 7px rgba(244,192,74,0.85)\"><\u002Fdiv>\n              <div style=\"position:absolute;top:33px;left:0;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#f4c04a;white-space:nowrap\">🥇 Ours<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6b7891;margin-top:22px;display:flex;gap:14px;flex-wrap:wrap\"><span><span style=\"color:#f4c04a\">▏Ours<\u002Fspan><\u002Fspan><span><span style=\"color:#cfd6e4\">▏<\u002Fspan>sunsean<\u002Fspan><span><span style=\"color:#cfa06a\">▏<\u002Fspan>UnoChen<\u002Fspan><span style=\"color:#4b566b\">dev board · hover any tick · to scale · 26 valid teams<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <p style=\"margin:0 0 14px;font-size:14px;line-height:1.65;color:#aeb9d0\">Reconstruct photographic images from an extreme information bottleneck — roughly <b style=\"color:#e8edf7\">0.008 bits per pixel<\u002Fb>, about a thousandth of a bit per pixel, where classic codecs collapse into blur and blocking. The challenge pushes <b style=\"color:#e8edf7\">generative priors<\u002Fb> (diffusion, GAN, autoregressive) to synthesize perceptually faithful detail rather than optimize pixel error, and the decoder ships as a standalone <b style=\"color:#e8edf7\">executable<\u002Fb> rather than a notebook. Our submission <b style=\"color:#e8edf7\">led the development leaderboard at #1 of 26<\u002Fb>, then placed <b style=\"color:#cfd6e4\">2nd in the final evaluation<\u002Fb>, which was judged primarily by <b style=\"color:#e8edf7\">human subjective assessment<\u002Fb> of fidelity and perceptual quality. It was the only top entry to pair the best fidelity in the field with a competitive perceptual score — the runner-up scored better on LPIPS (0.069 vs. 0.169) but gave up more than 2 dB of PSNR to get there.<\u002Fp>\n\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:#8a97ad;margin-bottom:10px\">📊 OUR DEV-BOARD METRICS · composite 72.643<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;max-width:700px\">\n          <div style=\"border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;background:rgba(255,255,255,0.02)\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#9aa7c2\">PSNR ↑<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:#e8edf7;margin-top:3px\">24.31<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;background:rgba(255,255,255,0.02)\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#9aa7c2\">MS-SSIM ↑<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:#e8edf7;margin-top:3px\">0.813<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;background:rgba(255,255,255,0.02)\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#9aa7c2\">LPIPS ↓<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:#e8edf7;margin-top:3px\">0.169<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;background:rgba(255,255,255,0.02)\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#9aa7c2\">DISTS ↓<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:#e8edf7;margin-top:3px\">0.057<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;background:rgba(255,255,255,0.02)\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#9aa7c2\">BPP ↓<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:#e8edf7;margin-top:3px\">0.008<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;color:#8a97ad;margin-bottom:14px\">🏆 DEV BOARD TOP-3 · 2026-07-07<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;max-width:520px\">\n          <div style=\"text-align:center\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#cfd6e4;margin-bottom:6px\">sunsean<br><span style=\"color:#8a97ad\">72.191<\u002Fspan><\u002Fdiv>\n            <div style=\"height:74px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#cfd6e4,rgba(207,214,228,0.22));display:flex;align-items:center;justify-content:center;font-weight:600;color:#0b1220\">🥈<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#f4c04a;margin-bottom:6px\">Ours (cchen847)<br><span style=\"color:#e8edf7\">72.643<\u002Fspan><\u002Fdiv>\n            <div style=\"height:104px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#f4c04a,rgba(244,192,74,0.25));display:flex;align-items:center;justify-content:center;font-weight:600;color:#3a2c05\">🥇<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#cfa06a;margin-bottom:6px\">UnoChen<br><span style=\"color:#8a97ad\">71.306<\u002Fspan><\u002Fdiv>\n            <div style=\"height:58px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#cfa06a,rgba(207,160,106,0.25));display:flex;align-items:center;justify-content:center;font-weight:600;color:#0b1220\">🥉<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:18px 0 0;font-size:13.5px;font-style:italic;color:#9aa7c2;line-height:1.6\">Why it's here — reconstructing a scene from almost no bits is the same problem as reconstructing perception from sparse neural signal: a generative decoder constrained by a severe bottleneck. The methods transfer directly to brain decoding.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- row of two: OOD + LibriBrain -->\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n        <div style=\"border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;background:rgba(255,255,255,0.012)\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600\">🧿 Brain-Score · Vision<\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#cfd6e4;border:1px solid rgba(207,214,228,0.4);border-radius:6px;padding:3px 8px\">#6 / 500+<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#aeb9d0\">The standing public leaderboard for primate vision — models are ranked by their average match to dozens of neural and behavioral benchmarks across V1, V2, V4, IT, and human behavior. Our submission, <b style=\"color:#e8edf7\">dinov2_vitl14_reg_lc<\u002Fb>, scores <b style=\"color:#e8edf7\">0.44<\u002Fb> overall for <b style=\"color:#e8edf7\">6th of 500+<\u002Fb> public models. <a href=\"https://www.brain-score.org/vision/leaderboard/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-decoration:none\">leaderboard ↗<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n        <div id=\"comp-libribrain\" style=\"border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;background:rgba(255,255,255,0.012);scroll-margin-top:80px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600\">🏅 NeurIPS 2025 · LibriBrain<\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9aa7c2\">5th / 53 · team lead<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#aeb9d0\">MEG Speech Detection (Team Ch3ng). <b style=\"color:#e8edf7\">F1 = 0.9071<\u002Fb> (1st 0.9166), decoding speech segments from <b style=\"color:#e8edf7\">306-channel MEG<\u002Fb> on a 50+ hour dataset. <a href=\"https://neural-processing-lab.github.io/2025-libribrain-competition/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-decoration:none\">competition ↗<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      \n    <\u002Fsection>\n\n\n    <!-- CV -->\n    <section id=\"cv\" style=\"padding:24px 0 60px;border-top:1px solid rgba(255,255,255,0.07)\" data-rev=\"\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:40px 0 26px\">\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:34px;margin:0;letter-spacing:-0.01em\">Curriculum Vitae<\u002Fh2>\n        <a href=\"assets/Cheng-Yeh-Chen-CV.pdf\" target=\"_blank\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--accent);border:1px solid rgba(91,155,255,0.4);border-radius:8px;padding:9px 14px\">full CV (pdf) ↓<\u002Fa>\n      <\u002Fdiv>\n\n      <!-- education row -->\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#8a97ad;margin-bottom:12px\">EDUCATION<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px\">\n        <div style=\"border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:20px;background:rgba(255,255,255,0.012)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent)\">'23 — present<\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;margin:8px 0 4px;font-weight:500\">Ph.D. student, ECE<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#aeb9d0\">Georgia Institute of Technology<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8a97ad;margin-top:6px\">Advisor:&nbsp;<span style=\"background-color: rgb(11, 18, 32);\">Raghupathy<\u002Fspan>&nbsp;Sivakumar · GNAN Lab<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:20px;background:rgba(255,255,255,0.012)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent)\">'19 — '21<\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;margin:8px 0 4px;font-weight:500\">M.S., Communication Eng.<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#aeb9d0\">National Taiwan University<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8a97ad;margin-top:6px\">Advisor: Hung-Yun Hsieh · TONIC Lab<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:20px;background:rgba(255,255,255,0.012)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent)\">'15 — '19<\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;margin:8px 0 4px;font-weight:500\">B.S., Electrical Eng.<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#aeb9d0\">National Taiwan University<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8a97ad;margin-top:6px\">Taipei, Taiwan<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- research experience row -->\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#8a97ad;margin-bottom:12px\">RESEARCH EXPERIENCE<\u002Fdiv>\n      <div style=\"border:1px solid rgba(91,155,255,0.28);border-radius:14px;padding:24px;background:linear-gradient(140deg,rgba(91,155,255,0.06),rgba(255,255,255,0.012));margin-bottom:14px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600\">Georgia Tech · GNAN Lab <span style=\"color:var(--accent);font-weight:500\">— BCI / NeuroAI<\u002Fspan><\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8a97ad\">Aug 2023 — present<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8a97ad;margin-top:4px\">Graduate Research Assistant · advisor Prof. Raghupathy Sivakumar<\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono',monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8fb4f2; margin: 16px 0 7px; font-weight: 800\">AI interpretability &amp; computational neuroscience<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;color:#aeb9d0\">\n          <li>Dissected transformer internals and mapped them onto brain activity — first for LLMs against fMRI <a href=\"https://mindtransformer.github.io/\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[MindTransformer · ICLR 2026]<\u002Fa>, then using cortical topography to steer Vision Transformers through training-free interventions <span style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px\">[Cortical Steering]<\u002Fspan>.<\u002Fli>\n          <li>Resolved methodological limits in brain–AI alignment by modulating temporal entanglement in fMRI <span style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px\">MindTrail<\u002Fspan>, and challenged the last-layer default in brain decoding through hierarchical brain–model alignment.<\u002Fli>\n        <\u002Ful>\n        <div style=\"font-family: 'IBM Plex Mono',monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8fb4f2; margin: 16px 0 7px; font-weight: 800\">Brain–computer interfaces (EEG)<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;color:#aeb9d0\">\n          <li>Investigated cross-condition signal amplification dynamics in evoked brain signals <a href=\"https://ieeexplore.ieee.org/abstract/document/10502941\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[PerCom Wksp 2024]<\u002Fa>, leading to a nonlinear ICA framework that disentangles universal neural sources for EEG-to-text / speech decoding <span style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px\">[Trident]<\u002Fspan>.<\u002Fli>\n          <li>Pioneered transfer learning for rapid BCI calibration via optimal transport <a href=\"https://dl.acm.org/doi/abs/10.1145/3615592.3616853\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[MobiCom Wksp 2023]<\u002Fa>, extended to microscopic domain adaptation that mitigates temporal drift across sessions <span style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px\">[Catch My Drift]<\u002Fspan>.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:24px;background:rgba(255,255,255,0.012);margin-bottom:20px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600\">National Taiwan University · TONIC Lab <span style=\"color:var(--accent);font-weight:500\">— wireless systems<\u002Fspan><\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8a97ad\">Sep 2019 — Jun 2021<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8a97ad;margin-top:4px\">Graduate Research Assistant · advisor Prof. Hung-Yun Hsieh<\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono',monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8fb4f2; margin: 16px 0 7px; font-weight: 800\">Wireless virtual reality<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;color:#aeb9d0\">\n          <li>Built an end-to-end pipeline of viewport-adaptive resource allocation for 360° video <a href=\"https://ieeexplore.ieee.org/document/10077518\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[IEEE TWC 2023]<\u002Fa>, efficient tiling for lightweight VR <a href=\"https://ieeexplore.ieee.org/document/10283536\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[IEEE ICC Wksp 2023]<\u002Fa>, and optimal multiview transcoding for volumetric content <a href=\"https://ieeexplore.ieee.org/document/10622856\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[IEEE ICC 2024]<\u002Fa>.<\u002Fli>\n        <\u002Ful>\n        <div style=\"font-family: 'IBM Plex Mono',monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8fb4f2; margin: 16px 0 7px; font-weight: 800\">4G / 5G protocol &amp; algorithm<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;color:#aeb9d0\">\n          <li>Discovered a low-volume DDoS attack against 5G URLLC <a href=\"https://ieeexplore.ieee.org/document/9200956\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[EuCNC 2020]<\u002Fa>, revealed queue correlation effects in multi-connectivity with packet duplication <a href=\"https://ieeexplore.ieee.org/document/9845682\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[IEEE WCL 2022]<\u002Fa>, and developed uplink optimization for clustered networks <a href=\"https://ieeexplore.ieee.org/document/10718318\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[IEEE TCOM 2024]<\u002Fa> and data-centric resource allocation for machine-type communications <a href=\"https://ieeexplore.ieee.org/document/10742939\" target=\"_blank\" rel=\"noopener\" style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;border-bottom:1px solid rgba(127,176,245,0.35);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#bcd8ff;border-bottom-color:#7fb0f5\">[IEEE TVT 2024]<\u002Fa>.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#8a97ad;margin-bottom:12px\">INDUSTRY<\u002Fdiv>\n      <div style=\"border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:18px 22px;background:rgba(255,255,255,0.012);margin-bottom:32px;font-size:13px;line-height:1.7;color:#aeb9d0\">\n        <b style=\"color:#e8edf7\">Trend Micro<\u002Fb> — software engineering intern: spear-phishing detector over a 10M+-email graph. <span style=\"color:#7fb0f5;font-family:'IBM Plex Mono',monospace;font-size:11px\">2019<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- skills / teaching / service row -->\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#8a97ad;margin-bottom:12px\">SKILLS<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px\">\n            <span style=\"border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 12px;color:#cfd6e4\">transformer probing<\u002Fspan>\n            <span style=\"border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 12px;color:#cfd6e4\">brain encoding / decoding<\u002Fspan>\n            <span style=\"border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 12px;color:#cfd6e4\">fMRI / EEG / MEG<\u002Fspan>\n            <span style=\"border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 12px;color:#cfd6e4\">PyTorch<\u002Fspan>\n            <span style=\"border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 12px;color:#cfd6e4\">HuggingFace<\u002Fspan>\n            <span style=\"border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 12px;color:#cfd6e4\">nilearn<\u002Fspan>\n            <span style=\"border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 12px;color:#cfd6e4\">Python · C/C++<\u002Fspan>\n            <span style=\"border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 12px;color:#cfd6e4\">MATLAB · Bash<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#8a97ad;margin-bottom:12px\">TEACHING<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#aeb9d0;line-height:1.7\">TA — Probability &amp; Statistics <span style=\"color:#6b7891;font-family:'IBM Plex Mono',monospace;font-size:11px\">NTU '20<\u002Fspan><br>TA — Computer Programming (C++) <span style=\"color:#6b7891;font-family:'IBM Plex Mono',monospace;font-size:11px\">NTU '19–'20<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#8a97ad;margin-bottom:12px\">SERVICE<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#aeb9d0;line-height:1.7\">Reviewer — NeurIPS, IEEE ICC,<br>IEEE TVT, IEEE Access<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- news -->\n    <section style=\"padding:24px 0 60px;border-top:1px solid rgba(255,255,255,0.07)\" data-rev=\"\">\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;margin:40px 0 20px;letter-spacing:-0.01em\">News<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <div style=\"display:grid;grid-template-columns:110px 1fr;gap:20px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent)\">Jul 2026<\u002Fdiv>\n          <div style=\"font-size:14px;color:#c8d1e2;line-height:1.55\">Now leading <b style=\"color:#f4c04a\">#1 / 23<\u002Fb> on the Algonauts 2025 In-Distribution board (post-challenge, Friends s7) — edged into first ahead of NCG.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:110px 1fr;gap:20px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent)\">Jan 2026<\u002Fdiv>\n          <div style=\"font-size:14px;color:#c8d1e2;line-height:1.55\"><i>The Mind's Transformer<\u002Fi> accepted to <b style=\"color:#e8edf7\">ICLR 2026<\u002Fb> with <b style=\"color:#e8edf7\">Top 7%<\u002Fb> review scores.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:110px 1fr;gap:20px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent)\">Dec 2025<\u002Fdiv>\n          <div style=\"font-size:14px;color:#c8d1e2;line-height:1.55\">Placed <b style=\"color:#e8edf7\">5th / 53<\u002Fb> (Team Lead) in NeurIPS 2025 LibriBrain — MEG Speech Detection.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:110px 1fr;gap:20px;padding:14px 0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8a97ad\">ongoing<\u002Fdiv>\n          <div style=\"font-size:14px;color:#c8d1e2;line-height:1.55\">Four NeuroAI manuscripts under review — EEG-to-image, EEG-to-text, fMRI scaling, and ViT-via-cortex.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <!-- footer -->\n  <footer style=\"border-top:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.012)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:32px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-family:'IBM Plex Mono',monospace\">\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600\">Cheng-Yeh Chen<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8a97ad;margin-top:4px\">Atlanta, GA · Georgia Tech · <span style=\"color:var(--accent)\">as of Jul 2026<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:18px;font-size:12.5px;color:#9aa7c2;flex-wrap:wrap\">\n        <a href=\"mailto:cchen847@gatech.edu\">email<\u002Fa>\n        <a href=\"https://github.com/cheng-yeh\" target=\"_blank\">github<\u002Fa>\n        <a href=\"https://www.linkedin.com/in/cheng-yeh\" target=\"_blank\">linkedin<\u002Fa>\n        <a href=\"https://scholar.google.com/citations?user=Wo5HJ8wAAAAJ\" target=\"_blank\">scholar<\u002Fa>\n        <a href=\"https://orcid.org/0000-0003-4520-2960\" target=\"_blank\">orcid<\u002Fa>\n        <a href=\"https://www.webofscience.com/wos/author/record/3492237\" target=\"_blank\">web of science<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5b9bff&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;motionSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.3,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._rafIds = {};\n    this._start = performance.now();\n    document.documentElement.style.setProperty('--accent', this.props.accent || '#5b9bff');\n    this.active = null;\n    this.buildBrainTexture();\n    setTimeout(() => this.buildBrainTexture(), 400);\n    this.setupCanvas('cyc-roadmap', (c, W, H, t) => this.drawRoadmap(c, W, H, t));\n    this.setupPerfBarTooltip('b2t-bar', 'b2t-tip');\n    this.setupPerfBarTooltip('algo-bar', 'algo-tip');\n    this.setupConceptLink();\n  }\n  setupConceptLink(tries) {\n    const root = document.getElementById('research');\n    const els = root ? [...root.querySelectorAll('[data-cx]')] : [];\n    if (!els.length) { if ((tries || 0) < 20) setTimeout(() => this.setupConceptLink((tries || 0) + 1), 250); return; }\n    const apply = (k) => els.forEach(el => { el.style.opacity = (!k || el.dataset.cx === k) ? '1' : '0.2'; });\n    els.forEach(el => {\n      el.addEventListener('pointerenter', () => apply(el.dataset.cx));\n      el.addEventListener('pointerleave', () => apply(null));\n    });\n  }\n  setupPerfBarTooltip(barId, tipId) {\n    const bar = document.getElementById(barId);\n    const tip = document.getElementById(tipId);\n    if (!bar || !tip) { setTimeout(() => this.setupPerfBarTooltip(barId, tipId), 300); return; }\n    const ticks = [...bar.querySelectorAll('[title]')].map(el => ({\n      el, left: parseFloat(el.style.left) || 0, label: el.getAttribute('title')\n    }));\n    // suppress the slow native tooltip; use our own\n    ticks.forEach(t => { t.el.dataset.tip = t.label; t.el.removeAttribute('title'); });\n    const move = (e) => {\n      const r = bar.getBoundingClientRect();\n      const pct = ((e.clientX - r.left) / r.width) * 100;\n      let best = null, bd = 1e9;\n      for (const t of ticks) { const d = Math.abs(t.left - pct); if (d < bd) { bd = d; best = t; } }\n      if (best && bd < 5) {\n        tip.textContent = best.label;\n        tip.style.left = Math.max(8, Math.min(92, best.left)) + '%';\n        tip.style.opacity = '1';\n        ticks.forEach(t => { t.el.style.filter = ''; });\n        best.el.style.filter = 'brightness(1.9)';\n      } else { tip.style.opacity = '0'; ticks.forEach(t => { t.el.style.filter = ''; }); }\n    };\n    bar.addEventListener('mousemove', move);\n    bar.addEventListener('mouseleave', () => { tip.style.opacity = '0'; ticks.forEach(t => { t.el.style.filter = ''; }); });\n    bar.style.cursor = 'crosshair';\n  }\n  buildBrainTexture() {\n    try {\n      const S = 300;\n      const oc = document.createElement('canvas'); oc.width = S; oc.height = S;\n      const o = oc.getContext('2d');\n      o.textAlign = 'center'; o.textBaseline = 'middle';\n      o.font = Math.round(S * 0.82) + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n      o.fillText('\\uD83E\\uDDE0', S / 2, S / 2 + S * 0.03);\n      const img = o.getImageData(0, 0, S, S), d = img.data;\n      let seen = 0;\n      for (let i = 0; i < d.length; i += 4) {\n        const a = d[i + 3];\n        if (a < 12) { d[i] = d[i + 1] = d[i + 2] = 0; d[i + 3] = 0; continue; }\n        seen++;\n        const L = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;\n        const tt = Math.pow(L, 0.85);\n        d[i] = Math.round(10 + tt * 108);\n        d[i + 1] = Math.round(40 + tt * 168);\n        d[i + 2] = Math.round(96 + tt * 159);\n        d[i + 3] = a;\n      }\n      if (seen < 200) return; // emoji not rendered yet; keep trying\n      o.putImageData(img, 0, 0);\n      this.brainImg = oc; this.brainImgS = S;\n      // trace the silhouette outline by radial ray-casting on the alpha mask\n      const cx = S / 2, cy = S / 2 + S * 0.03, N = 96, out = [];\n      for (let k = 0; k < N; k++) {\n        const ang = k / N * Math.PI * 2, ca = Math.cos(ang), sa = Math.sin(ang);\n        let rb = S * 0.16;\n        for (let r = 8; r < S * 0.52; r += 1.5) {\n          const x = Math.round(cx + ca * r), y = Math.round(cy + sa * r);\n          const a = (x < 0 || y < 0 || x >= S || y >= S) ? 0 : d[(y * S + x) * 4 + 3];\n          if (a > 50) rb = r;\n        }\n        out.push({ px: cx + ca * rb, py: cy + sa * rb, dx: ca, dy: sa });\n      }\n      this.brainOutline = out;\n    } catch (e) { /* keep previous texture */ }\n  }\n  rmDef() {\n    return {\n      hues: { text: '#9b6dff', speech: '#4c9dff', attspeech: '#22c9d6', images: '#34d27a', multi: '#f5a623' },\n      stimY: { text: 0.67, speech: 0.31, attspeech: 0.85, images: 0.49, multi: 0.13 },\n      modY: { fMRI: 0.16, MEG: 0.38, EEG: 0.60, iEEG: 0.82 },\n      works: [\n        { id: 'w1', stim: 'speech', mod: 'fMRI', y: 0.145 },\n        { id: 'w3', stim: 'multi', mod: 'fMRI', y: 0.265 },\n        { id: 'w7', stim: 'images', mod: 'fMRI', y: 0.384 },\n        { id: 'w4', stim: 'speech', mod: 'MEG', y: 0.516 },\n        { id: 'w6', stim: 'text', mod: 'EEG', y: 0.645 },\n        { id: 'w5', stim: 'images', mod: 'EEG', y: 0.772 },\n        { id: 'w2', stim: 'attspeech', mod: 'iEEG', y: 0.915 }\n      ]\n    };\n  }\n  setHover(kind, id) {\n    const def = this.rmDef();\n    let works;\n    if (kind === 'stim') works = def.works.filter(w => w.stim === id);\n    else if (kind === 'mod') works = def.works.filter(w => w.mod === id);\n    else works = def.works.filter(w => w.id === id);\n    const stims = new Set(works.map(w => w.stim)); if (kind === 'stim') stims.add(id);\n    const mods = new Set(works.map(w => w.mod)); if (kind === 'mod') mods.add(id);\n    this.active = { stims, mods, works: new Set(works.map(w => w.id)) };\n    this.applyDim();\n  }\n  applyDim() {\n    const root = document.getElementById('cyc-roadmap-root');\n    if (!root) return;\n    root.querySelectorAll('[data-el]').forEach(el => {\n      const p = el.dataset.el.split(':'), kind = p[0], id = p[1];\n      let on = true;\n      if (this.active) on = kind === 'stim' ? this.active.stims.has(id) : kind === 'mod' ? this.active.mods.has(id) : this.active.works.has(id);\n      el.style.opacity = on ? '1' : '0.15';\n    });\n  }\n  cubic(p0, c1, c2, p1, u) {\n    const v = 1 - u, a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;\n    return { x: a * p0.x + b * c1.x + c * c2.x + d * p1.x, y: a * p0.y + b * c1.y + c * c2.y + d * p1.y };\n  }\n  roadmapGeom(W, H) {\n    const def = this.rmDef();\n    const bx = 0.30 * W, by = 0.50 * H, br = 60;\n    const stimX = 0.10 * W, sr = 31, modX = 0.52 * W, mr = 37, workX = 0.70 * W;\n    return def.works.map(w => {\n      const sy = def.stimY[w.stim] * H, my = def.modY[w.mod] * H, wy = w.y * H;\n      const s = { x: stimX, y: sy };\n      const hub = { x: bx, y: by + br * 0.05 };\n      const mIn = { x: modX - mr, y: my }, mOut = { x: modX + mr, y: my }, wp = { x: workX, y: wy };\n      return {\n        id: w.id, hue: def.hues[w.stim],\n        seg1: [s, { x: 0.17 * W, y: sy }, { x: 0.24 * W, y: (sy + hub.y) / 2 }, hub],\n        seg2: [hub, { x: 0.39 * W, y: (hub.y + my) / 2 }, { x: 0.46 * W, y: my }, mIn],\n        seg3: [mOut, { x: (mOut.x + wp.x) / 2, y: my }, { x: (mOut.x + wp.x) / 2, y: wy }, wp]\n      };\n    });\n  }\n  pathPoint(tr, u) {\n    if (u < 1 / 3) return this.cubic(tr.seg1[0], tr.seg1[1], tr.seg1[2], tr.seg1[3], u * 3);\n    if (u < 2 / 3) return this.cubic(tr.seg2[0], tr.seg2[1], tr.seg2[2], tr.seg2[3], (u - 1 / 3) * 3);\n    return this.cubic(tr.seg3[0], tr.seg3[1], tr.seg3[2], tr.seg3[3], (u - 2 / 3) * 3);\n  }\n  drawRoadmap(ctx, W, H, t) {\n    const tracks = this.roadmapGeom(W, H);\n    const act = this.active;\n    const brainC = { x: 0.30 * W, y: 0.50 * H }, br = 60;\n    // connectors\n    tracks.forEach(tr => {\n      const on = !act || act.works.has(tr.id);\n      ctx.lineWidth = on ? 2.1 : 1.1;\n      ctx.strokeStyle = this.hexRgba(tr.hue, act ? (on ? 0.9 : 0.07) : 0.5);\n      [tr.seg1, tr.seg2, tr.seg3].forEach(sg => {\n        ctx.beginPath(); ctx.moveTo(sg[0].x, sg[0].y);\n        ctx.bezierCurveTo(sg[1].x, sg[1].y, sg[2].x, sg[2].y, sg[3].x, sg[3].y); ctx.stroke();\n      });\n    });\n    // flowing particles\n    ctx.save();\n    tracks.forEach((tr, i) => {\n      const on = !act || act.works.has(tr.id);\n      if (act && !on) return;\n      const hot = on && act;\n      const count = hot ? 6 : 3;\n      for (let m = 0; m < count; m++) {\n        const u = ((t * 0.11) + m / count + i * 0.04) % 1;\n        const p = this.pathPoint(tr, u);\n        ctx.shadowBlur = hot ? 12 : 7; ctx.shadowColor = tr.hue;\n        ctx.fillStyle = this.hexRgba(hot ? '#ffffff' : tr.hue, 0.85);\n        ctx.beginPath(); ctx.arc(p.x, p.y, hot ? 2.7 : 2.0, 0, 7); ctx.fill();\n      }\n    });\n    ctx.restore();\n    // brain hub\n    const pulse = 1 + 0.05 * Math.sin(t * 1.8);\n    const g = ctx.createRadialGradient(brainC.x, brainC.y, 0, brainC.x, brainC.y, br * 1.6 * pulse);\n    g.addColorStop(0, this.hexRgba('#5b9bff', 0.35)); g.addColorStop(0.5, this.hexRgba('#5b9bff', 0.12)); g.addColorStop(1, this.hexRgba('#5b9bff', 0));\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(brainC.x, brainC.y, br * 1.6 * pulse, 0, 7); ctx.fill();\n    // halo that follows the brain's own silhouette\n    ctx.save();\n    // soft breathing aura\n    const aura = ctx.createRadialGradient(brainC.x, brainC.y, br * 0.6, brainC.x, brainC.y, br * 1.5);\n    aura.addColorStop(0, this.hexRgba('#5b9bff', 0));\n    aura.addColorStop(0.72, this.hexRgba('#5b9bff', 0.05 + 0.03 * Math.sin(t * 1.4)));\n    aura.addColorStop(1, this.hexRgba('#5b9bff', 0));\n    ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(brainC.x, brainC.y, br * 1.5, 0, 7); ctx.fill();\n    ctx.restore();\n    // brain — blue-glow render of the 🧠 emoji, remapped pixel-by-pixel\n    ctx.save();\n    if (this.brainImg) {\n      const pulse = 1 + 0.03 * Math.sin(t * 1.8);\n      const w = br * 1.72 * pulse;\n      const x0 = brainC.x - w / 2, y0 = brainC.y - w / 2;\n      ctx.globalAlpha = 0.9 + 0.08 * Math.sin(t * 1.8);\n      ctx.shadowBlur = 16; ctx.shadowColor = '#5b9bff';\n      ctx.drawImage(this.brainImg, x0, y0, w, w);\n      ctx.shadowBlur = 0;\n      ctx.globalCompositeOperation = 'lighter';\n      ctx.globalAlpha = 0.28;\n      ctx.drawImage(this.brainImg, x0, y0, w, w);\n    }\n    ctx.restore();\n  }\n  componentWillUnmount() {\n    Object.values(this._rafIds || {}).forEach(id => cancelAnimationFrame(id));\n  }\n  hexRgba(hex, a) {\n    hex = (hex || '#5b9bff').replace('#', '');\n    const n = parseInt(hex, 16);\n    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';\n  }\n  setupCanvas(id, draw) {\n    const canvas = document.getElementById(id);\n    if (!canvas) return;\n    const W = canvas.clientWidth, H = canvas.clientHeight;\n    if (!W || !H) { requestAnimationFrame(() => this.setupCanvas(id, draw)); return; }\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    canvas.width = W * dpr; canvas.height = H * dpr;\n    const ctx = canvas.getContext('2d');\n    ctx.scale(dpr, dpr);\n    const speed = this.props.motionSpeed || 1;\n    const reduce = this.props.reduceMotion;\n    this._rafIds = this._rafIds || {};\n    const loop = (now) => {\n      const t = ((now - this._start) / 1000) * speed;\n      ctx.clearRect(0, 0, W, H);\n      draw(ctx, W, H, t);\n      this._rafIds[id] = requestAnimationFrame(loop);\n    };\n    draw(ctx, W, H, 1.2); // initial frame in case rAF is throttled\n    if (!reduce) this._rafIds[id] = requestAnimationFrame(loop);\n  }\n  bezier(p0, p1, p2, t) {\n    const u = 1 - t;\n    return { x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x, y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y };\n  }\n  drawAlign(ctx, W, H, t) {\n    const accent = this.props.accent || '#5b9bff';\n    const brain = { x: W * 0.16, y: H * 0.5 }, tf = { x: W * 0.84, y: H * 0.5 };\n    const mid = (brain.x + tf.x) / 2;\n    const topC = { x: mid, y: H * 0.5 - H * 0.42 }, botC = { x: mid, y: H * 0.5 + H * 0.42 };\n    ctx.lineWidth = 1; ctx.strokeStyle = this.hexRgba(accent, 0.18);\n    ctx.beginPath(); ctx.moveTo(brain.x, brain.y); ctx.quadraticCurveTo(topC.x, topC.y, tf.x, tf.y); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(tf.x, tf.y); ctx.quadraticCurveTo(botC.x, botC.y, brain.x, brain.y); ctx.stroke();\n    const pulse = 1 + 0.06 * Math.sin(t * 1.6), br = Math.min(W, H) * 0.2 * pulse;\n    const g = ctx.createRadialGradient(brain.x, brain.y, 0, brain.x, brain.y, br * 1.7);\n    g.addColorStop(0, this.hexRgba(accent, 0.22)); g.addColorStop(1, this.hexRgba(accent, 0));\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(brain.x, brain.y, br * 1.7, 0, 7); ctx.fill();\n    for (let i = 0; i < 26; i++) {\n      const a = i * 2.399, rad = br * Math.sqrt((i + 1) / 26);\n      const x = brain.x + Math.cos(a) * rad * 1.15, y = brain.y + Math.sin(a) * rad * 0.9;\n      const tw = 0.45 + 0.55 * Math.abs(Math.sin(t * 1.2 + i));\n      ctx.fillStyle = this.hexRgba('#bcd4ff', 0.35 + 0.5 * tw);\n      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 7); ctx.fill();\n    }\n    const gs = 4, cell = Math.min(W, H) * 0.08, gap = cell * 1.5;\n    const ox = tf.x - (gs - 1) * gap / 2, oy = tf.y - (gs - 1) * gap / 2;\n    for (let i = 0; i < gs; i++) for (let j = 0; j < gs; j++) {\n      const v = 0.28 + 0.5 * (0.5 + 0.5 * Math.sin(t * 2 + i * 0.9 + j * 0.6));\n      ctx.fillStyle = this.hexRgba(accent, v);\n      ctx.beginPath(); ctx.roundRect(ox + i * gap - cell / 2, oy + j * gap - cell / 2, cell, cell, 2); ctx.fill();\n    }\n    ctx.save();\n    for (let k = 0; k < 12; k++) {\n      const top = k % 2 === 0, ph = (t * 0.28 + k / 12) % 1;\n      const p = top ? this.bezier(brain, topC, tf, ph) : this.bezier(tf, botC, brain, ph);\n      const fade = Math.sin(ph * Math.PI);\n      ctx.shadowBlur = 8; ctx.shadowColor = accent;\n      ctx.fillStyle = this.hexRgba(top ? '#8bb4ff' : accent, 0.85 * fade);\n      ctx.beginPath(); ctx.arc(p.x, p.y, 2.3, 0, 7); ctx.fill();\n    }\n    ctx.restore();\n  }\n  drawDecode(ctx, W, H, t) {\n    const accent = this.props.accent || '#5b9bff', accent2 = '#8bb4ff';\n    const lx0 = W * 0.05, lx1 = W * 0.38, node = { x: W * 0.5, y: H * 0.5 };\n    for (let c = 0; c < 5; c++) {\n      const yb = H * (0.22 + 0.14 * c);\n      ctx.beginPath();\n      for (let x = lx0; x <= lx1; x += 3) {\n        const px = (x - lx0) / (lx1 - lx0);\n        const v = Math.sin(px * 14 - t * 4 + c) * 0.5 + Math.sin(px * 30 - t * 6 + c * 2) * 0.3 + Math.sin(px * 7 + t * 2) * 0.2;\n        const y = yb + v * H * 0.05 * (0.4 + px);\n        if (x === lx0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n      }\n      ctx.lineWidth = 1.4; ctx.strokeStyle = this.hexRgba(accent2, 0.5); ctx.stroke();\n      const fp = (t * 0.5 + c * 0.2) % 1;\n      ctx.fillStyle = this.hexRgba(accent2, 0.9 * (1 - Math.abs(fp - 0.5) * 2 + 0.3));\n      ctx.beginPath(); ctx.arc(lx1 + (node.x - lx1) * fp, yb + (node.y - yb) * fp, 1.8, 0, 7); ctx.fill();\n    }\n    const pr = Math.min(W, H) * 0.06 * (1 + 0.12 * Math.sin(t * 3));\n    const g = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, pr * 2.4);\n    g.addColorStop(0, this.hexRgba(accent, 0.5)); g.addColorStop(1, this.hexRgba(accent, 0));\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(node.x, node.y, pr * 2.4, 0, 7); ctx.fill();\n    ctx.fillStyle = this.hexRgba(accent, 0.9); ctx.beginPath(); ctx.arc(node.x, node.y, pr, 0, 7); ctx.fill();\n    const gs = 6, area = Math.min(W, H) * 0.62, cell = area / gs, ox = W * 0.62, oy = node.y - area / 2;\n    const scan = (t * 0.6) % 1.4;\n    for (let i = 0; i < gs; i++) for (let j = 0; j < gs; j++) {\n      const cx = i / gs, base = 0.5 + 0.5 * Math.sin(i * 1.1 + j * 0.8 + t * 1.5);\n      const near = Math.max(0, 1 - Math.abs(cx - scan) * 5), v = 0.12 + 0.55 * base + 0.4 * near;\n      ctx.fillStyle = this.hexRgba(near > 0.2 ? accent2 : accent, Math.min(0.95, v));\n      ctx.beginPath(); ctx.roundRect(ox + i * cell + 1.5, oy + j * cell + 1.5, cell - 3, cell - 3, 2); ctx.fill();\n    }\n    const ap = (t * 0.7) % 1;\n    ctx.fillStyle = this.hexRgba(accent2, 0.8 * Math.sin(ap * Math.PI));\n    ctx.beginPath(); ctx.arc(node.x + (ox - node.x) * ap, node.y, 2.4, 0, 7); ctx.fill();\n  }\n  renderVals() {\n    return {\n      onFigOver: (e) => { const el = e.target.closest('[data-el]'); if (el) { const p = el.dataset.el.split(':'); this.setHover(p[0], p[1]); } },\n      onFigLeave: () => { this.active = null; this.applyDim(); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
